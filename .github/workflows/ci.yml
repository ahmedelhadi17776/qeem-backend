name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 mypy pytest pytest-cov

      - name: Lint (Black)
        run: black --check app

      - name: Lint (Flake8)
        run: flake8 app

      - name: Type check (mypy)
        run: mypy --ignore-missing-imports app

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key
          SMTP_HOST: localhost
          SMTP_PORT: 587
          SMTP_USERNAME: test@example.com
          SMTP_PASSWORD: test-password
          SMTP_FROM_EMAIL: test@example.com
          ENABLE_EMAIL_VERIFICATION: false
          RATE_LIMITING_ENABLED: false
        run: |
          pytest --cov=app --cov-report=xml --cov-fail-under=75

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install bandit safety

      - name: Run security scan
        run: |
          bandit -r app/
          safety check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build -t qeem-backend:test . --progress=plain
          echo "Docker image built successfully"

      - name: Test Docker image
        run: |
          echo "Starting container..."
          docker run --rm -d --name qeem-test -p 8000:8000 \
            -e CI=true \
            -e ENVIRONMENT=ci \
            -e DATABASE_URL=sqlite:///./test_ci.db \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e JWT_SECRET=test-secret-key-for-docker-with-32-chars-minimum-length \
            -e ENABLE_EMAIL_VERIFICATION=false \
            -e RATE_LIMITING_ENABLED=false \
            qeem-backend:test

          # Wait a moment for container to start
          sleep 2

          # Check if container is still running
          echo "Container status:"
          docker ps -a | grep qeem-test

          # Show container logs for debugging
          echo "Container logs:"
          docker logs qeem-test 2>&1 || echo "No logs available (container may have crashed)"

          # wait up to 60s for readiness - check ping endpoint first (simpler)
          echo "Waiting for service to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:8000/ping > /dev/null; then
              echo "Service is responding after $i seconds"; break
            fi
            if [ $((i % 10)) -eq 0 ]; then
              echo "Attempt $i: Service not responding yet, showing logs..."
              docker logs qeem-test --tail 20
            fi
            echo "Attempt $i: Service not responding yet, waiting..."
            sleep 1
          done

          # Test ping endpoint (should always work)
          echo "Testing ping endpoint:"
          ping_response=$(curl -s http://localhost:8000/ping)
          echo "Ping response: $ping_response"

          # Test health endpoint (may fail in CI)
          echo "Testing health endpoint:"
          health_response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          echo "Health endpoint returned status: $health_response"

          if [ "$ping_response" != "" ]; then
            echo "✅ Service is responding (ping works)"
          else
            echo "❌ Service is not responding"
            exit 1
          fi
          docker stop qeem-test
